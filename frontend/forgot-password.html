<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password - CHUT</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111827;
            font-family: Arial, sans-serif;
        }

        .forgot-box {
            width: 380px;
            max-width: 90%;
            background: white;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
        }

            .forgot-box h1 {
                text-align: center;
                margin-bottom: 10px;
                font-size: 28px;
            }

            .forgot-box .subtitle {
                text-align: center;
                color: #6b7280;
                font-size: 14px;
                line-height: 1.5;
                margin-bottom: 25px;
            }

        .form-group {
            margin-bottom: 18px;
        }

            .form-group label {
                display: block;
                margin-bottom: 7px;
                font-size: 14px;
                font-weight: bold;
            }

            .form-group input {
                width: 100%;
                padding: 12px 14px;
                border: 1px solid #d1d5db;
                border-radius: 9px;
                outline: none;
                font-size: 15px;
                transition: 0.2s;
            }

                .form-group input:focus {
                    border-color: #111827;
                    box-shadow: 0 0 0 3px rgba(17,24,39,0.1);
                }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 9px;
            background: #111827;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

            button:hover {
                background: #1f2937;
            }

            button:disabled {
                background: #9ca3af;
                cursor: not-allowed;
            }

        #message {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
            font-weight: 500;
            min-height: 20px;
            white-space: pre-wrap;
        }

        .back-login {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #6b7280;
            text-decoration: none;
            font-size: 14px;
        }

            .back-login:hover {
                color: #111827;
            }
    </style>
</head>
<body>
    <div class="forgot-box">
        <h1>Lupa Password?</h1>
        <p class="subtitle">Masukkan email untuk mendapatkan kode verifikasi</p>

        <form id="emailForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="nama@email.com" required>
            </div>
            <button type="submit">Lanjutkan</button>
        </form>

        <p id="message"></p>
        <a href="/login.html" class="back-login">← Kembali ke Login</a>
    </div>

    <script>
                const form = document.getElementById("emailForm");
                const message = document.getElementById("message");
                const emailInput = document.getElementById("email");
                let isLoading = false;
                let storedEmail = "";

                form.addEventListener("submit", async (e) => {
                    e.preventDefault();
                    if (isLoading) return;
                    isLoading = true;

                    const email = emailInput.value.trim();
                    if (!email) {
                        showMsg("Email tidak boleh kosong!", "#dc2626");
                        isLoading = false;
                        return;
                    }

                    try {
                        console.log("📤 Request ke /forgot-password:", email);
                        const response = await fetch("/forgot-password", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ email })
                        });

                        console.log("Status:", response.status);
                        const data = await response.json();
                        console.log("Response:", data);

                        if (data.berhasil) {
                            storedEmail = email;
                            showMsg("✓ Kode verifikasi dikirim! Masukkan kode di bawah", "#10b981");
                            setTimeout(() => showCodeForm(email), 1500);
                        } else {
                            showMsg(data.pesan || "Error!", "#dc2626");
                        }
                    } catch (error) {
                        console.error("Error:", error);
                        showMsg("Gagal ke server:\n" + error.message, "#dc2626");
                    } finally {
                        isLoading = false;
                    }
                });

                function showMsg(text, color) {
                    message.textContent = text;
                    message.style.color = color;
                }

                function showCodeForm(email) {
                    const html = `<div id="codeDiv" style="margin-top:20px;padding-top:20px;border-top:1px solid #e5e7eb"><h2 style="font-size:20px;margin-bottom:10px;text-align:center">Verifikasi Kode</h2><p style="text-align:center;color:#6b7280;margin-bottom:20px">Kode dikirim ke<br><strong>` + email + `</strong></p><form id="codeForm"><div class="form-group"><input type="text" id="code" placeholder="000000" maxlength="6" inputmode="numeric" style="font-size:20px;text-align:center;letter-spacing:8px" required></div><button type="submit">Verifikasi</button><button type="button" id="resend" style="background:#6b7280;margin-top:10px">Kirim Ulang</button></form><p id="codeMsg" style="margin-top:16px;text-align:center;font-size:13px;min-height:20px"></p></div>`;

                    const old = document.getElementById("codeDiv");
                    if (old) old.remove();
                    form.insertAdjacentHTML("afterend", html);

                    const codeInput = document.getElementById("code");
                    const codeForm = document.getElementById("codeForm");
                    const resend = document.getElementById("resend");
                    const codeMsg = document.getElementById("codeMsg");

                    codeInput.addEventListener("input", (e) => {
                        e.target.value = e.target.value.replace(/[^0-9]/g, "");
                    });

                    codeForm.addEventListener("submit", async (e) => {
                        e.preventDefault();
                        if (isLoading) return;
                        isLoading = true;

                        const code = codeInput.value.trim();
                        if (code.length !== 6) {
                            setMsg("Harus 6 digit!", "#dc2626", codeMsg);
                            isLoading = false;
                            return;
                        }

                        try {
                            console.log("🔐 Verifikasi:", code);
                            const response = await fetch("/verify-email-code", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ email: storedEmail, code })
                            });

                            const data = await response.json();
                            console.log("Response:", data);

                            if (data.berhasil) {
                                setMsg("✓ Berhasil! Mengalihkan...", "#10b981", codeMsg);
                                setTimeout(() => {
                                    window.location.href = "/reset-password.html?token=" + data.resetToken;
                                }, 1500);
                            } else {
                                setMsg(data.pesan || "Invalid!", "#dc2626", codeMsg);
                            }
                        } catch (error) {
                            console.error("Error:", error);
                            setMsg("Error: " + error.message, "#dc2626", codeMsg);
                        } finally {
                            isLoading = false;
                        }
                    });

                    resend.addEventListener("click", async (e) => {
                        e.preventDefault();
                        if (isLoading) return;
                        isLoading = true;
                        resend.disabled = true;

                        try {
                            const response = await fetch("/forgot-password", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ email: storedEmail })
                            });

                            const data = await response.json();
                            if (data.berhasil) {
                                setMsg("✓ Kode baru dikirim!", "#10b981", codeMsg);
                                codeInput.value = "";
                                codeInput.focus();
                            } else {
                                setMsg(data.pesan || "Gagal", "#dc2626", codeMsg);
                            }
                        } catch (error) {
                            setMsg("Error: " + error.message, "#dc2626", codeMsg);
                        } finally {
                            isLoading = false;
                            resend.disabled = false;
                        }
                    });

                    codeInput.focus();
                }

                function setMsg(text, color, el) {
                    el.textContent = text;
                    el.style.color = color;
                }
    </script>
</body>
</html>
