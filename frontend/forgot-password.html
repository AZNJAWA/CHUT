
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lupa Password - CHUT</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111827;
            font-family: Arial, sans-serif;
            color: #111827;
        }

        .forgot-box {
            width: 380px;
            max-width: 90%;
            background: #ffffff;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

            .forgot-box h1 {
                text-align: center;
                margin-bottom: 10px;
                font-size: 28px;
            }

            .forgot-box .subtitle {
                text-align: center;
                color: #6b7280;
                font-size: 14px;
                line-height: 1.5;
                margin-bottom: 25px;
            }

        .form-group {
            margin-bottom: 18px;
        }

            .form-group label {
                display: block;
                margin-bottom: 7px;
                font-size: 14px;
                font-weight: bold;
            }

            .form-group input {
                width: 100%;
                padding: 12px 14px;
                border: 1px solid #d1d5db;
                border-radius: 9px;
                outline: none;
                font-size: 15px;
                transition: 0.2s;
            }

                .form-group input:focus {
                    border-color: #111827;
                    box-shadow: 0 0 0 3px rgba(17, 24, 39, 0.1);
                }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 9px;
            background: #111827;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

            button:hover {
                background: #1f2937;
            }

            button:active {
                transform: scale(0.98);
            }

        #message {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
            color: #374151;
            line-height: 1.5;
        }

        .back-login {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #6b7280;
            text-decoration: none;
            font-size: 14px;
        }

            .back-login:hover {
                color: #111827;
            }
    </style>
</head>

<body>

    <div class="forgot-box">

        <h1>Lupa Password?</h1>

        <p class="subtitle">
            Masukkan email akun CHUT kamu untuk mendapatkan
            instruksi reset password.
        </p>

        <form id="forgotForm">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input type="email"
                       id="email"
                       placeholder="nama@email.com"
                       required>

            </div>

            <button type="submit">
                Reset Password
            </button>

        </form>

        <p id="message"></p>

        <a href="/login.html" class="back-login">
            ← Kembali ke Login
        </a>

    </div>


    <script>

                const form = document.getElementById("forgotForm");
                const message = document.getElementById("message");

                form.addEventListener("submit", async (e) => {

                    e.preventDefault();

                    const email =
                        document.getElementById("email").value;

                    try {

                        const response = await fetch(
                            "/forgot-password",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type": "application/json"
                                },

                                body: JSON.stringify({
                                    email: email
                                })
                            }
                        );

                        const data = await response.json();

                        message.textContent = data.message;

                    } catch (error) {

                        console.error(error);

                        message.textContent =
                            "Gagal terhubung ke server.";

                    }

                });

    </script>

</body>

</html>
