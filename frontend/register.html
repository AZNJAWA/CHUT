<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="login.css">

    <title>REGISTER</title>
</head>

<body>

    <div class="login-box">

        <h1>Nah Buat Akun Disini!</h1>

        <form id="registerForm">

            <div class="name-div">
                <p id="name-input">Nama</p>
                <input type="text"
                       id="nama"
                       placeholder="Nama"
                       required>
            </div>
            <div class="email-div">
                <p id="email-input">Email</p>
                <input type="email"
                       id="email"
                       placeholder="Email"
                       required>
            </div>

            <div class="div-pswd">
                <p id="password-input">Password</p>
                <input type="password"
                       id="password"
                       placeholder="Password"
                       required>
            </div>


            <button type="submit">Register</button>

        </form>

        <a href="login.html">Sudah punya akun?</a>

        <p id="pesan"></p>

    </div>

    <script src="register.js"></script>

</body>

</html>
