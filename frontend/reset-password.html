
<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password - CHUT</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111827;
            font-family: Arial, sans-serif;
        }

        .reset-box {
            width: 380px;
            max-width: 90%;
            padding: 32px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #111827;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
            color: #111827;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
        }

            input:focus {
                border-color: #111827;
                box-shadow: 0 0 0 3px rgba(17, 24, 39, 0.1);
            }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 9px;
            background: #111827;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

            button:hover {
                background: #1f2937;
            }

            button:active {
                transform: scale(0.98);
            }

        #message {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
            color: #374151;
            line-height: 1.5;
            font-weight: 500;
            min-height: 20px;
        }

        .back-login {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #6b7280;
            text-decoration: none;
            font-size: 14px;
        }

            .back-login:hover {
                color: #111827;
            }
    </style>

</head>

<body>

    <div class="reset-box">

        <h1>Reset Password</h1>

        <p class="subtitle">
            Masukkan password baru untuk akun CHUT kamu.
        </p>

        <form id="resetForm">

            <div class="form-group">

                <label for="password">
                    Password Baru
                </label>

                <input type="password"
                       id="password"
                       placeholder="Password baru"
                       minlength="6"
                       required>

            </div>

            <div class="form-group">

                <label for="passwordConfirm">
                    Ulangi Password
                </label>

                <input type="password"
                       id="passwordConfirm"
                       placeholder="Ulangi password"
                       minlength="6"
                       required>

            </div>

            <button type="submit">
                Simpan Password
            </button>

        </form>

        <p id="message"></p>

        <a href="/login.html"
           class="back-login">
            ← Kembali ke Login
        </a>

    </div>


    <script>

        const form =
            document.getElementById("resetForm");

        const message =
            document.getElementById("message");

        const passwordInput = 
            document.getElementById("password");

        const passwordConfirmInput = 
            document.getElementById("passwordConfirm");

        let isLoading = false;

        // Get token from URL
        const params =
            new URLSearchParams(window.location.search);

        const token =
            params.get("token");


        if (!token) {
            message.textContent = "Token tidak ditemukan. Silahkan gunakan link dari email.";
            message.style.color = "#dc2626";
            form.style.display = "none";
        }


        form.addEventListener("submit", async (e) => {

            e.preventDefault();

            if (isLoading) return;
            isLoading = true;

            const password =
                passwordInput.value;

            const passwordConfirm =
                passwordConfirmInput.value;

            if (!password || !passwordConfirm) {
                message.textContent = "Semua field wajib diisi!";
                message.style.color = "#dc2626";
                isLoading = false;
                return;
            }

            if (password.length < 6) {
                message.textContent = "Password minimal 6 karakter!";
                message.style.color = "#dc2626";
                isLoading = false;
                return;
            }

            if (password !== passwordConfirm) {

                message.textContent =
                    "Password tidak sama!";
                message.style.color = "#dc2626";
                isLoading = false;
                return;
            }


            try {

                console.log("📤 Kirim reset password...", { token: token.substring(0, 10) + "..." });

                const response = await fetch(
                    "/reset-password",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            token: token,
                            password: password,
                            passwordConfirm: passwordConfirm
                        })
                    }
                );

                console.log("📥 Response status:", response.status);

                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }

                const data =
                    await response.json();

                console.log("✅ Response data:", data);

                if (data.berhasil) {
                    message.textContent =
                        data.pesan || "Password berhasil diubah!";
                    message.style.color = "#10b981";

                    form.reset();

                    setTimeout(() => {

                        window.location.href =
                            "/login.html";

                    }, 2000);
                } else {
                    message.textContent = 
                        data.pesan || "Terjadi kesalahan!";
                    message.style.color = "#dc2626";
                }

            } catch (error) {

                console.error("❌ Error detail:", error.message);

                message.textContent =
                    "❌ Gagal terhubung ke server.\n\n" + error.message + "\n\nPastikan server berjalan di http://localhost:3000";
                message.style.color = "#dc2626";
                message.style.whiteSpace = "pre-wrap";

            } finally {
                isLoading = false;
            }

        });

    </script>

</body>

</html>
